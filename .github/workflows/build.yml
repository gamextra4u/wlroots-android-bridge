name: Android Build (wlroots-android-bridge)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout + submodules
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2️⃣ Ensure submodules initialized (extra safety)
      - name: Init git submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      # 3️⃣ Setup JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 4️⃣ Install Android SDK + NDK
      - name: Install Android SDK and NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip

          mkdir -p $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools

          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/cmdline-tools/bin

          yes | sdkmanager --sdk_root=$ANDROID_HOME \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.0" \
            "ndk;25.2.9519653"

      # 5️⃣ Gradlew permission
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 6️⃣ Run BEFORE gradle sync/build
      - name: Compile Debug AIDL
        run: ./gradlew compileDebugAidl

      # 7️⃣ Build APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 8️⃣ Upload APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk