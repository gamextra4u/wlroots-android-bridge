name: Android Wayland Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - uses: actions/checkout@v4

      # 2️⃣ Install dependencies
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential meson ninja-build clang llvm \
            pkg-config python3 git autoconf automake libtool \
            libxml2-dev libexpat1-dev wayland-protocols \
            unzip curl

      # 3️⃣ Download NDK
      - name: Download Android NDK
        run: |
          curl -LO https://dl.google.com/android/repository/android-ndk-r27b-linux.zip
          unzip android-ndk-r27b-linux.zip
          echo "ANDROID_NDK_HOME=$GITHUB_WORKSPACE/android-ndk-r27b" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH

      # 4️⃣ Create output dir
      - run: mkdir -p output/include

      # 5️⃣ Create ndk-crossfile.txt (FROM TEXT)
      - name: Create crossfile
        run: |
          cat > ndk-crossfile.txt <<EOF
          [binaries]
          c = '$GITHUB_WORKSPACE/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp = '$GITHUB_WORKSPACE/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar = '$GITHUB_WORKSPACE/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$GITHUB_WORKSPACE/android-ndk-r27b/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'

          [properties]
          needs_exe_wrapper = true
          sys_root = '$GITHUB_WORKSPACE/output'
          pkg_config_libdir = '$GITHUB_WORKSPACE/output/lib/pkgconfig'
          EOF

      # 6️⃣ Clone sources
      - name: Clone repos
        run: |
          git clone https://gitlab.freedesktop.org/wayland/wayland.git
          git clone https://gitlab.freedesktop.org/wayland/wayland-protocols.git
          git clone https://github.com/libffi/libffi.git
          git clone https://github.com/xkbcommon/libxkbcommon.git

      # 7️⃣ Build libffi
      - name: Build libffi
        run: |
          cd libffi
          ./autogen.sh
          cd src/aarch64
          ../../configure \
            --host=aarch64-linux-android \
            --disable-shared \
            --enable-static \
            CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" \
            CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            --prefix="$GITHUB_WORKSPACE/output"
          make -j$(nproc)
          make install

      # 8️⃣ Generate protocols
      - name: Generate protocols
        run: |
          wayland-scanner server-header \
            < wayland-protocols/stable/xdg-shell/xdg-shell.xml \
            > output/include/xdg-shell.h

          wayland-scanner private-code \
            < wayland-protocols/stable/xdg-shell/xdg-shell.xml \
            > output/include/xdg-shell.c

      # 9️⃣ Build wayland
      - name: Build wayland
        run: |
          cd wayland
          meson setup build \
            --cross-file ../ndk-crossfile.txt \
            -Ddocumentation=false \
            -Dscanner=false \
            -Dprefix=$GITHUB_WORKSPACE/output
          ninja -C build
          ninja -C build install

      # 🔟 Build libxkbcommon
      - name: Build libxkbcommon
        run: |
          cd libxkbcommon
          meson setup build \
            --cross-file ../ndk-crossfile.txt \
            -Denable-tools=false \
            -Denable-x11=false \
            -Denable-xkbregistry=false \
            -Denable-bash-completion=false \
            -Dxkb-config-root=/data/data/app.polarbear/files/archlinux-aarch64/usr/share/X11/xkb \
            -Dx-locale-root=/data/data/app.polarbear/files/archlinux-aarch64/usr/share/X11/locale \
            -Dprefix=$GITHUB_WORKSPACE/output \
            -Dc_args="-Wl,-z,max-page-size=16384" \
            -Dcpp_args="-Wl,-z,max-page-size=16384"
          meson compile -C build
          meson install -C build

      # 1️⃣1️⃣ Upload output
      - uses: actions/upload-artifact@v4
        with:
          name: android-wayland-output
          path: output/